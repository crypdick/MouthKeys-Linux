version = 2
source_roots = [
  {path = "linux/src/mouthkeys", module = "mouthkeys"},
  {path = "linux/tests", module = "tests"},
  {path = "scripts/prek_hooks", module = "scripts.prek_hooks"},
]
standalone_modules = [
  "scripts.prek_hooks.check_exception_handling",
  "scripts.prek_hooks.check_file_length",
  "scripts.prek_hooks.check_private_test_imports",
  "scripts.prek_hooks.check_timeless_comments",
]
check_package_cycles = true

[roles.primitives]
allowed_dependencies = []
[roles.desktop]
allowed_dependencies = ["primitives"]
[roles.app]
allowed_dependencies = ["primitives", "desktop"]
[roles.tools]
allowed_dependencies = []
[roles.tests]
allowed_dependencies = ["primitives", "desktop", "app", "tools"]

# The application is one flat package; many use cases currently share this owner.
# Promote a cohesive unit only when it has a real interface and dependency contract.
[[packages]]
name = "app"
root = "mouthkeys"
role = "app"
public_modules = [
  "mouthkeys",
  "mouthkeys.api_dictionary", "mouthkeys.ai_provider_settings", "mouthkeys.ai_providers", "mouthkeys.ai_stream", "mouthkeys.ai_stream_events", "mouthkeys.assistance", "mouthkeys.command_preview",
  "mouthkeys.assistant_chats", "mouthkeys.assistant_editor", "mouthkeys.assistant_history", "mouthkeys.assistant_session", "mouthkeys.assistant_ui", "mouthkeys.audio",
  "mouthkeys.backup", "mouthkeys.backup_ui", "mouthkeys.benchmark", "mouthkeys.benchmark_reports", "mouthkeys.capture_recorder", "mouthkeys.cli", "mouthkeys.config", "mouthkeys.control", "mouthkeys.daemon", "mouthkeys.credentials",
  "mouthkeys.data_lock", "mouthkeys.delivery", "mouthkeys.desktop_entry", "mouthkeys.desktop_input", "mouthkeys.dictionary", "mouthkeys.dictionary_transfer", "mouthkeys.dictionary_ui",
  "mouthkeys.engines", "mouthkeys.file_history", "mouthkeys.file_speakers", "mouthkeys.file_transcription", "mouthkeys.file_transcription_ui",
  "mouthkeys.forced_alignment", "mouthkeys.formatting", "mouthkeys.gui", "mouthkeys.gui_launch", "mouthkeys.help_ui", "mouthkeys.history_ui", "mouthkeys.hotkeys",
  "mouthkeys.lark", "mouthkeys.lark_monitor", "mouthkeys.learning", "mouthkeys.learning_ui", "mouthkeys.local_api", "mouthkeys.microphone", "mouthkeys.microphone_ui",
  "mouthkeys.model_cache", "mouthkeys.model_downloads_ui", "mouthkeys.model_progress", "mouthkeys.models_ui", "mouthkeys.native_asr", "mouthkeys.native_worker", "mouthkeys.nemo_asr", "mouthkeys.onboarding",
  "mouthkeys.operations", "mouthkeys.overlay", "mouthkeys.overlay_assistant", "mouthkeys.overlay_process", "mouthkeys.overlay_rendering",
  "mouthkeys.portal_shortcuts", "mouthkeys.postprocess", "mouthkeys.profiles", "mouthkeys.prompt_profiles_ui",
  "mouthkeys.pronunciation", "mouthkeys.pronunciation_spans", "mouthkeys.qt_control", "mouthkeys.provider_settings_ui", "mouthkeys.provider_tools",
  "mouthkeys.recording_assistant", "mouthkeys.recording_capture", "mouthkeys.recording_cleanup", "mouthkeys.recording_delivery", "mouthkeys.recording_destination", "mouthkeys.recording_edit", "mouthkeys.recording_finalizer", "mouthkeys.recording_inference", "mouthkeys.recording_job",
  "mouthkeys.recording_learning", "mouthkeys.recording_preview", "mouthkeys.recording_setup", "mouthkeys.recording_state", "mouthkeys.recording_transcript", "mouthkeys.regional", "mouthkeys.regional_ui", "mouthkeys.routing",
  "mouthkeys.service", "mouthkeys.settings_choices", "mouthkeys.settings_fields", "mouthkeys.settings_form", "mouthkeys.setup_languages", "mouthkeys.shortcut_capture", "mouthkeys.spoken_punctuation", "mouthkeys.statistics", "mouthkeys.stats_view", "mouthkeys.storage",
  "mouthkeys.transcribe", "mouthkeys.transcript_window", "mouthkeys.transformers_asr", "mouthkeys.tray", "mouthkeys.tray_status", "mouthkeys.upstream_backup", "mouthkeys.vocabulary", "mouthkeys.window_theme",
]

[[packages]]
name = "native_protocol"
root = "mouthkeys.native_protocol"
role = "primitives"
public_modules = ["mouthkeys.native_protocol"]

[[packages]]
name = "processes"
root = "mouthkeys.processes"
role = "primitives"
public_modules = ["mouthkeys.processes"]

[[packages]]
name = "word_alignment"
root = "mouthkeys.word_alignment"
role = "primitives"
public_modules = ["mouthkeys.word_alignment"]

[[packages]]
name = "waveform"
root = "mouthkeys.trace"
role = "primitives"
public_modules = ["mouthkeys.trace"]

[[packages]]
name = "capture"
root = "mouthkeys.capture"
role = "desktop"
public_modules = ["mouthkeys.capture"]

[[packages]]
name = "capture_readiness"
root = "mouthkeys.capture_readiness"
role = "desktop"
public_modules = ["mouthkeys.capture_readiness"]

[[packages]]
name = "desktop"
root = "mouthkeys.desktop"
role = "desktop"
public_modules = ["mouthkeys.desktop"]

[[packages]]
name = "portal_helper"
root = "mouthkeys.portal_helper"
role = "desktop"
public_modules = ["mouthkeys.portal_helper"]

[[packages]]
name = "x11_shortcuts"
root = "mouthkeys.x11_shortcuts"
role = "desktop"
public_modules = ["mouthkeys.x11_shortcuts"]

[[packages]]
name = "accessibility"
root = "mouthkeys.accessibility"
role = "desktop"
public_modules = ["mouthkeys.accessibility"]

[[packages]]
name = "atspi_helper"
root = "mouthkeys.atspi_helper"
role = "desktop"
public_modules = ["mouthkeys.atspi_helper"]

[[packages]]
name = "clipboard"
root = "mouthkeys.clipboard"
role = "desktop"
public_modules = ["mouthkeys.clipboard"]

[[packages]]
name = "tests"
root = "tests"
role = "tests"
public_modules = []

[[packages]]
name = "repository_tools"
root = "scripts.prek_hooks"
role = "tools"
