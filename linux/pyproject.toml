[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mouthkeys-linux"
version = "0.2.2"
description = "Local, keyboard-driven dictation for Linux"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
# PyAV 19 removed metadata_errors, still used by faster-whisper 1.2.x's decoder.
dependencies = [
    "faster-whisper>=1.2.1,<1.3",
    "av>=11,<19",
    "numpy>=1.23,<3",
    "beartype>=0.23.1",
    "huggingface-hub>=0.21",
    "tqdm>=4.66",
]

[project.urls]
Repository = "https://github.com/crypdick/MouthKeys-Linux"
Documentation = "https://github.com/crypdick/MouthKeys-Linux/blob/main/linux/README.md"

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8,<7"]
onnx = ["onnx-asr[cpu,hub]>=0.12,<0.13"]
diarization = ["sherpa-onnx>=1.12.20,<2"]
transformers = ["transformers[torch]>=5.22.2,<5.23", "librosa>=0.10,<1", "soundfile>=0.12,<1"]
nemo = [
    "nemo_toolkit[asr]>=3,<4",
    "omegaconf>=2.3,<3",
    "pyyaml>=6",
    "torch==2.11.0",
    "torchaudio==2.11.0",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "detect-secrets>=1.5.0",
    "flynt>=1.0.6",
    "mypy>=2.4.1",
    "prek>=0.5.11",
    "pytest>=8,<10",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pyupgrade>=3.22.0",
    "ruff>=0.12",
    "types-pyyaml>=6.0.12.20261113",
    "types-tqdm>=4.70.0.20261106",
    "validate-pyproject>=0.27",
    "vulture>=2.16",
]

[project.scripts]
mouthkeys = "mouthkeys.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mouthkeys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n 4 --failed-first --durations=5 --durations-min=1 --timeout=20 --timeout-method=signal --cov-branch --cov=mouthkeys --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["mouthkeys"]

[tool.coverage.report]
# Headless baseline. Raise as coverage improves; hardware checks are tracked in PARITY.md.
fail_under = 75
skip_empty = true

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "gi.*", "nemo.*", "omegaconf.*", "onnx_asr.*", "onnxruntime.*", "sherpa_onnx.*", "torch.*"]
# System bindings and optional model stacks aren't installed in the headless dev environment.
follow_imports = "skip"
ignore_missing_imports = true

[tool.deptry.package_module_name_map]
nemo_toolkit = "nemo"

[tool.deptry.per_rule_ignores]
# GI is bundled by the Linux distribution for optional desktop integration.
DEP001 = ["gi"]
# The native worker loads Transformers by name; its audio backends are runtime plugins.
# NeMo uses the PyTorch-matched torchaudio build at runtime.
DEP002 = ["transformers", "librosa", "soundfile", "torchaudio"]
# faster-whisper provides the same ONNX Runtime used by the optional ONNX adapter.
DEP003 = ["onnxruntime"]

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 80
# Autouse fixture argument orders environment setup before Qt initialization.
ignore_names = ["isolated_environment"]

[tool.uv]
# Delay adoption of new uploads; the lockfile records the resulting cutoff.
exclude-newer = "3 days"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
# Deliberate prose, locale punctuation and dictation syntax.
allowed-confusables = ["‘", "’", "›", "–", "×", "？"]
select = [
    "A",
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "ANN206",
    "ANN401",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "COM818",
    "C90",
    "D402",
    "D414",
    "D418",
    "D419",
    "DOC102",
    "DOC202",
    "DOC403",
    "DTZ",
    "E",
    "ERA",
    "EXE",
    "F",
    "FA",
    "FBT",
    "FURB101",
    "FURB103",
    "FURB122",
    "FURB129",
    "FURB132",
    "FURB157",
    "FURB161",
    "FURB162",
    "FURB168",
    "FURB169",
    "FURB171",
    "FURB177",
    "FURB181",
    "FURB188",
    "G",
    "I",
    "INP",
    "ISC004",
    "LOG",
    "N",
    "PERF",
    "PGH",
    "PIE",
    "PLC",
    "PLE",
    "PLR0124",
    "PLR0133",
    "PLR0206",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR1702",
    "PLR1704",
    "PLR1711",
    "PLR1714",
    "PLR1716",
    "PLR1722",
    "PLR1733",
    "PLR1736",
    "PLR5501",
    "PLW",
    "PT",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T10",
    "T20",
    "TC",
    "TID",
    "TRY004",
    "TRY201",
    "TRY203",
    "TRY300",
    "TRY400",
    "TRY401",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "E501",
    "TRY003",
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"**/smoke_*.py" = ["S101", "T201"]
"**/tools/**/*.py" = ["T201"]
"**/_tools/**/*.py" = ["T201"]
"**/scripts/**/*.py" = ["T201"]
"**/{cli,main,__main__}.py" = ["T201"]
# Plain test modules are collected by pytest and can import local fixture helpers.
"**/tests/**/*.py" = ["ANN", "ARG", "C901", "FBT", "F841", "INP001", "PLR0912", "PLR0913", "PLR0915", "S101", "SLF", "T201"]
