[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mouthkeys-linux"
version = "0.2.1"
description = "Local, keyboard-driven dictation for Linux"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
# PyAV 19 removed metadata_errors, still used by faster-whisper 1.2.x's decoder.
dependencies = ["faster-whisper>=1.2.1,<1.3", "av>=11,<19", "numpy>=1.23,<3"]

[project.urls]
Repository = "https://github.com/crypdick/MouthKeys-Linux"
Documentation = "https://github.com/crypdick/MouthKeys-Linux/blob/main/linux/README.md"

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8,<7"]
onnx = ["onnx-asr[cpu,hub]>=0.12,<0.13"]
diarization = ["sherpa-onnx>=1.12.20,<2"]
transformers = ["transformers[torch]>=5.22.2,<5.23", "librosa>=0.10,<1", "soundfile>=0.12,<1"]
nemo = ["nemo_toolkit[asr]>=3,<4", "torch==2.11.0", "torchaudio==2.11.0"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[project.scripts]
mouthkeys = "mouthkeys.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mouthkeys"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
